[data-theme]{--divider:var(--line);--input-bg:var(--surface);--icon:var(--sub);--tab-bg:var(--surface);--tab-inactive:var(--sub);--switch-knob:#FFFFFF;--strong:var(--primary);--primary-edge:var(--primary);--scrim:rgba(30,28,40,0.4);--shadow:0 -8px 24px rgba(30,28,40,0.08);--lift:0 1px 3px rgba(30,28,40,0.12);--font:'Pretendard','Noto Sans CJK KR','Noto Color Emoji',system-ui,sans-serif;--head-h:0px}
[data-theme]{--today:var(--text);--toast-bg:var(--text);--toast-fg:var(--surface)}
/* 목업용 — 두 기본 테마의 --lv-* 는 저장소 값을 몰라 시안 A 화면에서 읽은 비슷한 색 */
[data-theme="soft-pastel"]{--strong:#B4587F;--primary-edge:var(--accent);--lv-full:#B9788F;--lv-half:#E6C6D0}
[data-theme="cosmic-dream"]{--lv-full:#A84F88;--lv-half:#4A3A66}
[data-theme="cosmic-dream"]{--scrim:rgba(5,7,18,0.62);--shadow:0 -8px 24px rgba(0,0,0,0.45);--lift:0 1px 3px rgba(0,0,0,0.4)}
/* tokens-focus.css 와 같은 값 */
[data-theme]{--focus-ring:var(--strong);--focus-track:var(--empty)}
[data-theme="cosmic-dream"]{--focus-ring:var(--accent)}
[data-theme="cinema"]{color-scheme:light;--bg:#F4F0F0;--surface:#FCFAFA;--raised:#E9E5E5;--line:#DAD6D7;--ol:#1A1618;--sh:#D2CECE;--text:#1E1A1C;--sub:#5E5A5C;--faint:#B0ACAC;--primary:#26222A;--on-primary:#FFFFFF;--btn-hi:#636066;--btn-lo:#1C191F;--secondary:#E6E2E2;--accent:#B3202E;--strong:#26222A;--tab-active:#26222A;--tint:#F8DCDE;--tint-text:#8A1A26;--me:#F2C14E;--me-ink:#1A1618;--her:#9CCAF0;--her-ink:#1A1618;--both:#A6D8B8;--both-ink:#1A1618;--empty:#E7E3E3;--empty-text:#565253;--success:#2E7D4F;--warning:#9A5B00;--warn:#C62F3A;--sec-dot:#B3202E;--deco-a:#B3202E;--deco-b:#1A1618;--primary-edge:#26222A;--today:#1E1A1C;--lv-full:#8A6A70;--lv-half:#E1D8DA;--toast-bg:#1E1A1C;--toast-text:#FCFAFA;--tab-bg:#FCFAFA;--tab-inactive:#5E5A5C}

*{box-sizing:border-box}
body{margin:0;background:#E9E6EA;font-family:'Noto Sans CJK KR',sans-serif}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background-color:var(--bg);color:var(--text);font-family:var(--font);padding:20px 20px 0}
.scr.w320{width:320px;height:640px;padding:16px 14px 0}
.scr button{font:inherit;color:inherit}
.caption{margin:0;font-size:13px;font-weight:500;color:var(--sub)}
.title{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-0.02em}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pillbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--text)}
.pillbtn svg{width:18px;height:18px}
.dday{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--tint-text);font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.card{background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.k{font-size:13px;color:var(--sub);font-weight:600}
.big{font-size:44px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 10px;white-space:nowrap}
.big.zero{color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--raised);color:var(--text);white-space:nowrap}
.chip.both{background:var(--both);color:var(--both-ink)}
.chip.tint{background:var(--tint);color:var(--tint-text)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.me{background:var(--me)}.dot.her{background:var(--her)}
.live{position:relative}
.live::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:.35}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.av.her{background:var(--her);color:var(--her-ink)}.av.me{background:var(--me);color:var(--me-ink)}
.av.dim{opacity:.55}
.nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:13px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{min-height:44px;border-radius:14px;border:1.5px solid var(--primary-edge);background:var(--primary);color:var(--on-primary)!important;font-size:15px;font-weight:700;padding:0 16px;white-space:nowrap}
.btn.tint{background:var(--tint);color:var(--tint-text)!important;border-color:transparent}
.btn.plain{background:var(--surface);color:var(--text)!important;border-color:var(--line)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tint-text)!important}
.btn.wide{width:100%}
.btn[disabled]{opacity:1;background:var(--raised);color:var(--sub)!important;border-color:transparent}
.list{background:var(--surface);border-radius:20px;padding:4px 16px;margin-top:12px}
.lrow{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--divider)}
.lrow:last-child{border-bottom:0}
.bar{width:4px;align-self:stretch;margin:12px 0;border-radius:2px;background:var(--me)}
.tm{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--tint);color:var(--tint-text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.play.on{background:var(--primary);color:var(--on-primary)}
.play svg{width:18px;height:18px}
.lrow.add{color:var(--tint-text);font-weight:700;font-size:14px;gap:8px}
.lrow.more{color:var(--sub);font-weight:600;font-size:14px;justify-content:space-between}
.lrow.active{background:var(--tint);margin:0 -16px;padding:0 16px;border-radius:14px;border-bottom:0}
.lrow.active .ds{color:var(--tint-text)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--sub);font-weight:600;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.graph{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:96px;margin-top:12px}
.gcol{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.gbar{width:9px;border-radius:3px 3px 0 0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.gbar .p{border-radius:3px 3px 0 0}
.gbar .b{background:var(--both);border-radius:0}
.glab{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;font-size:12px;color:var(--sub);text-align:center;font-weight:600}
.glab .today{color:var(--today);font-weight:800;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.glab .fut{color:var(--faint)}
.gline{margin-top:10px;font-size:13px;color:var(--sub);font-weight:600}
.gline b{color:var(--text)}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:4px 12px 8px;background:var(--tab-bg);border-top:1px solid var(--divider)}
.tabbar button{flex:1 1 0;min-height:56px;border:0;background:none;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tab-inactive);font-size:12px;font-weight:600;position:relative}
.tabbar button[aria-current="page"]{color:var(--tab-active);font-weight:700}
.tabbar svg{width:24px;height:24px}
.tdots{position:absolute;top:4px;left:calc(50% + 6px);display:flex}
.tdots i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--tab-bg);display:block}
.tdots i+i{margin-left:-3px}
.band{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:12px;padding:0 6px 0 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--her);font-size:14px;font-weight:700}
.band.me{border-color:var(--me)}.band.both{border-color:var(--both)}
.band .sp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .act{min-height:44px;display:inline-flex;align-items:center;padding:0 8px;color:var(--tint-text);font-weight:800;font-size:14px;white-space:nowrap}
.band .t{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:600}
.note{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--tint);color:var(--tint-text);font-size:14px;font-weight:600;line-height:1.5}
.note b{font-weight:800}
.foot{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
/* 집중 화면 */
.fs{padding:0 20px}
.fs .dawn{position:absolute;left:0;right:0;top:0}
.ftop{display:flex;align-items:center;justify-content:space-between;height:56px;margin-top:calc(var(--head-h) + 6px)}
.ibtn{width:44px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--text);padding:0}
.ibtn svg{width:24px;height:24px}
.subj{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:700}
.mode{min-width:44px;text-align:right;font-size:13px;font-weight:700;color:var(--sub)}
.badge{display:flex;justify-content:center;margin-top:6px;height:36px}
.badge span{display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--both);color:var(--both-ink);font-size:14px;font-weight:800}
.badge span.pause{background:var(--raised);color:var(--text)}
.ringwrap{position:relative;width:248px;height:248px;margin:10px auto 0}
.ringwrap svg{position:absolute;inset:0}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ftime{font-size:50px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1}
.ftime.paused{color:var(--sub)}
.fsub{margin-top:8px;font-size:13px;color:var(--sub);font-weight:600}
.laps{display:flex;gap:4px;margin-top:8px}
.laps i{width:6px;height:6px;border-radius:50%;background:var(--focus-ring);display:block}
