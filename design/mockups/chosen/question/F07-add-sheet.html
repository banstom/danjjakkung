<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>7 · 질문 넣기 (묻기 · 섞기)</title>
<style>
body{margin:0}
[data-theme]{--divider:var(--line);--input-bg:var(--surface);--icon:var(--sub);--tab-bg:var(--surface);--tab-inactive:var(--sub);--switch-knob:#FFFFFF;--strong:var(--primary);--primary-edge:var(--primary);--success:#2E7D4F;--warning:#9A5B00;--scrim:rgba(30,28,40,0.4);--shadow:0 -8px 24px rgba(30,28,40,0.08);--lift:0 1px 3px rgba(30,28,40,0.12);--font:'Pretendard','Tossface',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
[data-theme="soft-pastel"]{color-scheme:light;--bg:#FFF8E7;--surface:#FFFFFF;--raised:#FCF4EE;--line:#EEE8E7;--text:#34313A;--sub:#6D6973;--faint:#C9C2CB;--primary:#F6DDE8;--on-primary:#34313A;--secondary:#DCD9FA;--accent:#BC7897;--tab-active:#94486B;--strong:#B4587F;--primary-edge:var(--accent);--tint:#FBEDF3;--tint-text:#8E4467;--both:#D98E94;--both-ink:#2A2730;--her:#D78EAD;--her-ink:#2A2730;--me:#B0A5E8;--me-ink:#2A2730;--empty:#F1EAE8;--empty-text:#5F5A66;--warn:#C62F3A}
[data-theme="cosmic-dream"]{color-scheme:dark;--bg:#101426;--surface:#191D33;--raised:#232842;--line:#30334B;--text:#F4F2FF;--sub:#B5B5D0;--faint:#4C506E;--primary:#7557C8;--on-primary:#FFFFFF;--secondary:#292650;--accent:#8F74E0;--tab-active:#6CD8E8;--tint:#292650;--tint-text:#CFC3FF;--both:#A84F88;--both-ink:#FFFFFF;--her:#267C91;--her-ink:#FFFFFF;--me:#7052B8;--me-ink:#FFFFFF;--empty:#2B3050;--empty-text:#C9C9E0;--warn:#FF7B86;--success:#5BD08A;--warning:#F2B84B;--scrim:rgba(5,7,18,0.62);--shadow:0 -8px 24px rgba(0,0,0,0.45);--lift:0 1px 3px rgba(0,0,0,0.4)}
.scr{box-sizing:border-box;background:var(--bg);color:var(--text);font-family:var(--font);position:relative;overflow:hidden;padding:20px 20px 0}
.scr button{font:inherit;color:inherit}
.caption{margin:0;font-size:13px;font-weight:500;color:var(--sub)}
.title{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:6px}
.card{background:var(--surface);border-radius:20px;padding:14px 16px;box-sizing:border-box}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.hollow{background:transparent !important;box-shadow:inset 0 0 0 2px var(--faint)}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:4px 12px 8px;background:var(--tab-bg);border-top:1px solid var(--divider)}
.tabbar button{flex:1 1 0;min-height:56px;border:0;background:none;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tab-inactive);font-size:12px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--tab-active);font-weight:700}
.seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--raised)}
.seg button{min-height:40px;border:0;border-radius:10px;background:none;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--lift)}
.iconbtn{width:44px;height:44px;border:0;background:none;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.mnav{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.mnav b{font-size:17px;font-weight:700}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:8px 20px 24px;box-sizing:border-box}
.grabber{display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet__title{margin:0;font-size:18px;font-weight:700}
.sheet__sub{margin:4px 0 0;font-size:13px;color:var(--sub);line-height:1.5}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.bar{display:flex;align-items:center;gap:4px;min-height:44px}
.list{background:var(--surface);border-radius:20px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;background:none;padding:0;text-align:left;border-bottom:1px solid var(--divider)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;font-size:16px;font-weight:600}
.row .vl{font-size:13px;color:var(--sub);font-weight:500}
.btn{min-height:48px;border-radius:14px;border:1.5px solid var(--primary-edge);background:var(--primary);color:var(--on-primary);font-size:15px;font-weight:700;padding:0 16px}
.btn[disabled]{opacity:.45}
.btn2{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;padding:0 16px}
.btn2.sm,.btn.sm{min-height:40px;font-size:14px;border-radius:12px;padding:0 12px}
.tbtn{min-height:44px;border:0;background:none;padding:0 4px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.hint{margin:6px 2px 0;font-size:12px;color:var(--sub);line-height:1.5}
.tint{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--tint);color:var(--tint-text);font-size:14px;font-weight:700;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--raised);font-size:13px;font-weight:700;border:0}
.pill[aria-pressed="true"]{background:var(--tint);color:var(--tint-text)}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--empty);position:relative;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--switch-knob);box-shadow:var(--lift)}
.switch[aria-checked="true"]{background:var(--strong)}
.switch[aria-checked="true"]::after{left:23px}
.new{display:inline-flex;align-items:center;min-height:20px;padding:0 6px;border-radius:6px;background:var(--tint);color:var(--tint-text);font-size:11px;font-weight:800;margin-left:6px;vertical-align:2px}
/* 결산 카드 */
.recap{width:390px;height:844px;padding:0;background:var(--tint)}
.prog{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:4px}
.prog span{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--text) 18%,transparent)}
.prog span.on{background:var(--text)}
.xbtn{position:absolute;right:6px;top:24px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--text)}
.kick{font-size:14px;font-weight:700;color:var(--sub);margin:0}
.big{font-size:72px;font-weight:800;letter-spacing:-0.03em;line-height:1;margin:0}
.big small{font-size:32px}
.lead{margin:0;font-size:16px;line-height:1.55}
.panel{background:var(--surface);border-radius:18px;padding:14px}
.memo{background:var(--raised);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;word-break:keep-all}
.tap{position:absolute;left:0;right:0;bottom:28px;margin:0;text-align:center;font-size:12px;color:var(--sub)}

/* ── 오늘의 질문 ── */
.qcard{background:var(--tint);border-radius:22px;padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px}
.qkick{margin:0;font-size:13px;font-weight:700;color:var(--tint-text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qtext{margin:0;font-size:22px;font-weight:700;line-height:1.4;letter-spacing:-0.02em;word-break:keep-all}
.qfoot{display:flex;align-items:center;justify-content:flex-end;min-height:44px;margin:0 -6px -4px 0}
.qfoot .tbtn{color:var(--tint-text)}
.qtag{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:999px;background:var(--surface);color:var(--text);font-size:12px;font-weight:700}
.ans{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.ans__head{display:flex;align-items:center;gap:8px;min-height:24px}
.ans__who{font-size:15px;font-weight:700}
.ans__meta{font-size:12px;color:var(--sub);font-weight:500}
.ans__sp{flex:1}
.ans__body{margin:0;font-size:16px;line-height:1.6;word-break:keep-all}
.ans.wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ans.wait .ans__body{color:var(--sub);font-size:15px}
.locked{display:flex;flex-direction:column;gap:8px;padding:2px 0}
.locked i{display:block;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--empty) 0 22px,transparent 22px 28px)}
.lockline{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--tint-text);margin-top:2px}
.ta{box-sizing:border-box;width:100%;min-height:112px;border-radius:14px;border:1.5px solid var(--line);background:var(--input-bg);padding:12px 14px;font:inherit;font-size:16px;line-height:1.55;color:var(--text);resize:none;display:block;word-break:keep-all}
.ta.on{border-color:var(--accent)}
.ta::placeholder{color:var(--sub)}
.taline{display:flex;align-items:center;gap:10px}
.count{flex:1;font-size:12px;color:var(--sub)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
/* 시안 B · 대화 */
.chat{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.sysq{align-self:center;max-width:300px;text-align:center;background:var(--tint);border-radius:18px;padding:12px 16px}
.sysq b{display:block;font-size:12px;color:var(--tint-text);margin-bottom:4px}
.sysq p{margin:0;font-size:18px;font-weight:700;line-height:1.4;word-break:keep-all}
.bub{max-width:270px;border-radius:20px;padding:11px 14px;font-size:16px;line-height:1.55;word-break:keep-all;box-sizing:border-box}
.bub.l{align-self:flex-start;border-bottom-left-radius:6px;background:color-mix(in srgb,var(--her) 22%,var(--surface))}
.bub.r{align-self:flex-end;border-bottom-right-radius:6px;background:color-mix(in srgb,var(--me) 26%,var(--surface))}
.bwho{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.bwho.r{align-self:flex-end}
.inbar{position:absolute;left:0;right:0;bottom:73px;display:flex;gap:8px;align-items:flex-end;padding:10px 16px;background:var(--surface);border-top:1px solid var(--divider)}
.inbar .ta{min-height:48px;padding:12px 14px;border-radius:24px}
.bub .locked i{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--text) 16%,transparent) 0 22px,transparent 22px 28px)}
.send{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--primary-edge);background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
/* 시안 C · 쪽지 */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.note{background:var(--surface);border-radius:18px;padding:12px 12px 14px;min-height:300px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;position:relative}
.note__body{margin:0;font-size:15px;line-height:1.6;word-break:keep-all}
.note.fold{background:var(--raised);align-items:center;justify-content:center;text-align:center;overflow:hidden}
.note.fold::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.4%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.6%),linear-gradient(45deg,transparent 49.4%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.6%)}
.note.fold > *{position:relative;background:var(--raised);padding:6px 10px;border-radius:10px}
.note .ta{min-height:180px;font-size:15px;padding:10px}
/* 입구 */
.qentry{display:flex;flex-direction:column;gap:8px;border:0;text-align:left;width:100%}
.qentry .qt{font-size:17px;font-weight:700;line-height:1.4;word-break:keep-all}
.qstat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.clamp2{word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.band{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--tint);color:var(--tint-text);padding:0 12px 0 14px;text-align:left;margin-top:12px}
.band b{font-size:14px;font-weight:700;flex:1;line-height:1.4}
.rt{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--divider)}
.rt:last-child{border-bottom:0}
.rt .nm{flex:1;font-size:16px;font-weight:600}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.me{background:var(--me);box-shadow:none;color:var(--me-ink)}
.chk.her{background:var(--her);box-shadow:none;color:var(--her-ink)}
/* 지난 질문 · 우리 질문 */
.hrow{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;border:0;border-bottom:1px solid var(--divider);background:none;padding:8px 0;text-align:left}
.hrow:last-child{border-bottom:0}
.hrow .d{width:40px;flex-shrink:0;font-size:12px;color:var(--sub);font-weight:700;line-height:1.3;text-align:center}
.hrow .d b{display:block;font-size:17px;color:var(--text)}
.hrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hrow .q{font-size:15px;font-weight:600;line-height:1.4;word-break:keep-all}
.hrow .s{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:4px;flex-shrink:0}
.late{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px dashed var(--accent);color:var(--tint-text);background:var(--surface)}
.hid{font-size:15px;font-weight:600;color:var(--sub)}
.slot{box-sizing:border-box;border:2px dashed var(--accent);border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--tint-text);font-size:12px;font-weight:700;padding:4px}

/* ── 쪽지 시안 공통 ── */
.nhead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.nhead b{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.nhead span{font-size:12px;color:var(--sub);font-weight:500}
.ntext{margin:0;font-size:15px;line-height:26px;word-break:keep-all}
.nta{display:block;width:100%;box-sizing:border-box;min-height:182px;border:0;background:transparent;resize:none;font:inherit;font-size:15px;line-height:26px;color:var(--text);padding:0;word-break:keep-all}
.nta::placeholder{color:var(--sub)}
.nfoot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px}
.nfoot .count{font-size:12px;color:var(--sub);flex:1}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px;align-items:start}
.nlock{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:700;color:var(--tint-text);line-height:1.45;word-break:keep-all}
.nlock small{font-size:12px;color:var(--sub);font-weight:600}
.n{position:relative;box-sizing:border-box;min-height:360px;padding:16px 14px 14px;display:flex;flex-direction:column}
.pill.sm{min-height:32px;padding:0 10px;font-size:12px}
.pill.sm svg{width:15px;height:15px}

/* V1 줄 노트 + 마스킹 테이프 */
.v1 .n{background:var(--surface) repeating-linear-gradient(to bottom,transparent 0 25px,var(--line) 25px 26px);background-position:0 63px;box-shadow:var(--lift);border-radius:4px;padding-top:22px}
.v1 .n.me{transform:rotate(-1.2deg)}
.v1 .n.her{transform:rotate(1.4deg);margin-top:10px}
.v1 .n::before{content:"";position:absolute;top:-9px;left:50%;width:62px;height:20px;margin-left:-31px;transform:rotate(-4deg);opacity:.85}
.v1 .n.me::before{background:color-mix(in srgb,var(--me) 70%,transparent)}
.v1 .n.her::before{background:color-mix(in srgb,var(--her) 70%,transparent);transform:rotate(5deg)}
.v1 .n.fold{background:var(--raised);background-image:linear-gradient(to bottom,color-mix(in srgb,var(--text) 6%,transparent),transparent 40%);justify-content:center;min-height:200px;margin-top:84px}
.v1 .n.fold::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--text) 14%,transparent),var(--line))}
.v1 .qn{position:relative;background:var(--tint);border-radius:4px;padding:22px 18px 14px;box-shadow:var(--lift);margin-top:10px}
.v1 .qn::before,.v1 .qn::after{content:"";position:absolute;top:-8px;width:54px;height:18px;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.v1 .qn::before{left:-10px;transform:rotate(-28deg)}
.v1 .qn::after{right:-10px;transform:rotate(28deg)}

/* V2 편지 봉투 */
.v2 .n{background:var(--surface);border-radius:6px;box-shadow:var(--lift);background-image:linear-gradient(to bottom,transparent calc(33% - 1px),color-mix(in srgb,var(--text) 7%,transparent) 33%,transparent calc(33% + 1px),transparent calc(66% - 1px),color-mix(in srgb,var(--text) 7%,transparent) 66%,transparent calc(66% + 1px))}
.v2 .to{font-size:13px;font-weight:800;color:var(--tint-text);margin:0 0 8px;letter-spacing:.02em}
.v2 .from{font-size:13px;font-weight:800;text-align:right;margin:8px 0 0;color:var(--tint-text)}
.v2 .env{position:relative;box-sizing:border-box;min-height:236px;margin-top:56px;border-radius:8px;background:var(--raised);box-shadow:var(--lift);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 10px 18px}
.v2 .env::before{content:"";position:absolute;left:0;right:0;top:0;height:58%;background:color-mix(in srgb,var(--her) 34%,var(--raised));clip-path:polygon(0 0,100% 0,50% 100%)}
.v2 .env::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),color-mix(in srgb,var(--text) 10%,transparent) 50%,transparent calc(50% + 1px)) left bottom/50% 60% no-repeat,linear-gradient(to top left,transparent calc(50% - 1px),color-mix(in srgb,var(--text) 10%,transparent) 50%,transparent calc(50% + 1px)) right bottom/50% 60% no-repeat}
.v2 .seal{position:absolute;left:50%;top:58%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--her);color:var(--her-ink);display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:var(--lift)}
.v2 .env .nlock{position:relative;z-index:1}
.v2 .qn{position:relative;background:var(--tint);border-radius:18px;padding:18px 84px 16px 18px}
.v2 .stamp{position:absolute;right:14px;top:14px;width:56px;height:66px;box-sizing:border-box;background:var(--surface);border:2px dashed var(--accent);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(4deg)}
.v2 .stamp b{font-size:22px;font-weight:800;line-height:1}
.v2 .stamp span{font-size:11px;font-weight:700;color:var(--tint-text)}

/* V3 포스트잇 */
.v3 .n{border-radius:2px;box-shadow:0 6px 10px -6px color-mix(in srgb,var(--text) 35%,transparent);padding-top:24px}
.v3 .n.me{background:color-mix(in srgb,var(--me) 34%,var(--surface));transform:rotate(-2deg)}
.v3 .n.her{background:color-mix(in srgb,var(--her) 34%,var(--surface));transform:rotate(1.8deg);margin-top:12px}
.v3 .n::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:color-mix(in srgb,var(--text) 6%,transparent)}
.v3 .n::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(135deg,var(--bg) 50%,color-mix(in srgb,var(--text) 14%,transparent) 50%)}
.v3 .n.back{background:var(--raised);justify-content:center}
.v3 .n.back::before{background:color-mix(in srgb,var(--her) 55%,transparent)}
.v3 .qn{position:relative;background:var(--tint);border-radius:2px;padding:24px 18px 16px;transform:rotate(-.8deg);box-shadow:0 6px 10px -6px color-mix(in srgb,var(--text) 35%,transparent)}
.v3 .qn::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:color-mix(in srgb,var(--text) 5%,transparent)}
