<style>
body{margin:0}
[data-theme]{--divider:var(--line);--input-bg:var(--surface);--icon:var(--sub);--switch-knob:#FFFFFF;--strong:var(--primary);--primary-edge:var(--primary);--scrim:rgba(30,28,40,0.4);--shadow:0 -8px 24px rgba(30,28,40,0.08);--lift:0 1px 3px rgba(30,28,40,0.12);--font:'Pretendard','Tossface',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}

.tk2{position:relative;width:318px;height:36px;border-radius:10px;background:var(--raised);overflow:hidden}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.slp2{position:absolute;top:5px;bottom:5px;border-radius:7px;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text)}
.mk{position:absolute;top:11px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--me);box-shadow:0 0 0 2px var(--raised)}

.col{position:absolute;bottom:24px;width:12px;margin-left:-6px;border-radius:4px 4px 0 0;background:var(--me)}
.col.sn{background:var(--surface);box-shadow:inset 0 0 0 2px var(--me)}
.cv{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.base{position:absolute;left:0;right:0;bottom:23px;height:1px;background:var(--faint)}
.seg2{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.sch{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;background:var(--secondary);font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.empty{width:318px;height:28px;border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}.tsub{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:14px}
.stem{position:absolute;width:1px;margin-left:-0.5px;background:var(--faint)}
.axl{position:absolute;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}.mv2{margin:2px 0 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;white-space:nowrap}
.c-carb{background:var(--me)}
.c-pro{background:color-mix(in srgb,var(--me) 58%,var(--surface))}
.c-fat{background:color-mix(in srgb,var(--me) 28%,var(--surface))}
.stk{position:absolute;width:16px;margin-left:-8px;display:flex;flex-direction:column;gap:1px;border-radius:4px 4px 0 0;overflow:hidden}
.stk i{display:block;min-height:2px}
.tsub2{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap;line-height:14px}

.lg{display:inline-flex;align-items:center;gap:4px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.fl{position:absolute;height:0;border-top:1.5px dotted var(--sub)}
.ft{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;line-height:12px;text-align:center;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;gap:12px;min-height:26px;font-size:12px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--divider);font-variant-numeric:tabular-nums}
.fdot{width:2px;height:16px;border-left:2px dotted var(--faint);margin-left:-8px}
.lead{position:absolute;width:0;border-left:1px dotted var(--sub)}.c-me{background:var(--me);color:var(--me-ink)}.c-her{background:var(--her);color:var(--her-ink)}
.me-carb{background:var(--me)}.me-pro{background:color-mix(in srgb,var(--me) 58%,var(--surface))}.me-fat{background:color-mix(in srgb,var(--me) 28%,var(--surface))}
.her-carb{background:var(--her)}.her-pro{background:color-mix(in srgb,var(--her) 58%,var(--surface))}.her-fat{background:color-mix(in srgb,var(--her) 28%,var(--surface))}

.lg{gap:4px}
.goal{padding:12px 14px}

.gl2{font-weight:700}

.gt2{font-weight:500;color:var(--sub)}

.band{position:absolute;left:0;right:0;background:var(--raised);border-radius:8px}
.tog{position:absolute;width:4px;margin-left:-2px;border-radius:2px;background:var(--both)}
.lane2{position:absolute;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.pc{border-top:0}
.gopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:68px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:12px}
.gopt .gn{font-size:16px;font-weight:700}
.gopt .gd{font-size:12px;color:var(--sub)}
.gopt.on{border-color:var(--primary-edge);background:var(--tint)}
.gopt.on .gd{color:var(--tint-text)}
.in2{width:64px;min-height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--input-bg);text-align:right;padding:0 10px;font-size:16px;font-weight:600}
.ed2{font-size:12px;font-weight:700;color:var(--tint-text);padding:4px 8px;border-radius:999px;background:var(--tint)}.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--sub)}

.basis{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;min-height:56px;border:0;border-radius:16px;background:var(--surface);padding:10px 16px;font-size:13px;line-height:1.45;color:var(--text)}
.basis b{font-size:15px}
.basis span span{color:var(--sub);font-size:12px}
.disc{margin-top:8px;padding:12px 14px;border-radius:16px;background:var(--raised);font-size:12px;line-height:1.55;color:var(--text)}
.disc b{display:block;font-size:13px;margin-bottom:2px}
.steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;font-size:13px;line-height:1.5}
.steps li::before{content:counter(s);grid-row:span 3;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--tint-text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps b{font-size:14px}
.steps span{color:var(--text)}
.steps em{font-style:normal;font-size:11px;color:var(--sub)}
[data-theme="soft-pastel"]{--carb:#5FAFA6;--pro:#EE9A5C;--fat:#F3D36E}
[data-theme="cosmic-dream"]{--carb:#3E9A92;--pro:#D9874A;--fat:#CDB04F}
.mc-carb{background:var(--carb)}.mc-pro{background:var(--pro)}.mc-fat{background:var(--fat)}
.stk i{position:relative;display:flex;align-items:center;justify-content:center}
.sl2{font-size:11px;font-weight:700;line-height:1;color:var(--me-ink)}

.tgt{position:absolute;border-radius:8px;background:color-mix(in srgb,var(--both) 30%,var(--surface))}

.qd{margin:4px 0 12px;font-size:13px;color:var(--tint-text)}

.meter{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--me)}
.mrow{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}.sw0.on{background:var(--accent)}

.scr{height:900px}
