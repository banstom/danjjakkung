<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta charset="utf-8">
<title>① 목표 고르기 · 짝꿍 식탁 목업</title>
</head>
<body>
<style>
body{margin:0}
[data-theme]{--divider:var(--line);--input-bg:var(--surface);--icon:var(--sub);--switch-knob:#FFFFFF;--strong:var(--primary);--primary-edge:var(--primary);--scrim:rgba(30,28,40,0.4);--shadow:0 -8px 24px rgba(30,28,40,0.08);--lift:0 1px 3px rgba(30,28,40,0.12);--font:'Pretendard','Tossface',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
[data-theme="soft-pastel"]{color-scheme:light;--bg:#FFF8E7;--surface:#FFFFFF;--raised:#FCF4EE;--line:#EEE8E7;--text:#34313A;--sub:#6D6973;--faint:#C9C2CB;--primary:#F6DDE8;--on-primary:#34313A;--secondary:#DCD9FA;--accent:#BC7897;--strong:#B4587F;--primary-edge:var(--accent);--tint:#FBEDF3;--tint-text:#8E4467;--both:#D98E94;--both-ink:#2A2730;--her:#D78EAD;--her-ink:#2A2730;--me:#B0A5E8;--me-ink:#2A2730;--empty:#F1EAE8;--empty-text:#5F5A66;--warn:#C62F3A}
[data-theme="cosmic-dream"]{color-scheme:dark;--bg:#101426;--surface:#191D33;--raised:#232842;--line:#30334B;--text:#F4F2FF;--sub:#B5B5D0;--faint:#4C506E;--primary:#7557C8;--on-primary:#FFFFFF;--secondary:#292650;--accent:#8F74E0;--tint:#292650;--tint-text:#CFC3FF;--both:#A84F88;--both-ink:#FFFFFF;--her:#267C91;--her-ink:#FFFFFF;--me:#7052B8;--me-ink:#FFFFFF;--empty:#2B3050;--empty-text:#C9C9E0;--warn:#FF7B86;--scrim:rgba(5,7,18,0.62);--shadow:0 -8px 24px rgba(0,0,0,0.45);--lift:0 1px 3px rgba(0,0,0,0.4)}
.scr{width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:var(--font);position:relative;overflow:hidden;padding:12px 20px 0}
.scr button,.scr textarea,.scr input{font:inherit;color:inherit}
.caption{margin:0;font-size:13px;font-weight:500;color:var(--sub)}
.title{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.card{background:var(--surface);border-radius:20px;padding:14px 16px}
.list{background:var(--surface);border-radius:20px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;background:none;padding:0;text-align:left;border-bottom:1px solid var(--divider)}
.row:last-child{border-bottom:0}
.row .ic{width:36px;height:36px;border-radius:12px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--icon);flex-shrink:0}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .nm{font-size:16px;font-weight:600}
.row .ds{font-size:13px;color:var(--sub)}
.row .vl{font-size:14px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700}
.c-me{background:var(--me);color:var(--me-ink)}.c-her{background:var(--her);color:var(--her-ink)}.c-both{background:var(--both);color:var(--both-ink)}
.btn{min-height:52px;border-radius:14px;border:1.5px solid var(--primary-edge);background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:700;padding:0 16px}
.btn2{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;padding:0 16px}
.bar{display:flex;align-items:center;gap:4px;min-height:44px;margin:0 -12px}
.iconbtn{width:44px;height:44px;border:0;background:none;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.seg{display:flex;background:var(--raised);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--lift)}
.ta{display:block;width:100%;box-sizing:border-box;min-height:132px;border:1.5px solid var(--line);border-radius:16px;background:var(--input-bg);padding:14px;font-size:16px;line-height:1.55;resize:none}
.pick{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.pick[aria-pressed="true"]{border-color:var(--primary-edge);background:var(--primary);color:var(--on-primary)}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 28px;background:var(--bg)}
.ml{margin:0;font-size:12px;font-weight:600;color:var(--sub)}
.mv{margin:2px 0 0;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.mu{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.ms{margin:2px 0 0;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.lane{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.track{position:relative;width:318px;height:28px;border-radius:8px;background:var(--raised)}
.slp{position:absolute;top:4px;height:20px;border-radius:6px;background:var(--secondary)}
.m{position:absolute;top:9px;width:10px;height:10px;border-radius:50%;background:var(--me)}
.m.sn{background:var(--surface);box-shadow:inset 0 0 0 2px var(--me)}
.ticks{position:relative;height:18px;margin-top:4px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.gap{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tm{width:46px;font-size:14px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}.tl{position:relative;width:318px}
.pin{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.pin .lb{font-size:11px;line-height:1.25;text-align:center;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.pin .lb b{display:block;font-size:12px;color:var(--text)}
.pin .st{flex:1;width:1.5px;background:var(--me);margin-top:2px}
.tk2{position:relative;width:318px;height:36px;border-radius:10px;background:var(--raised);overflow:hidden}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.slp2{position:absolute;top:5px;bottom:5px;border-radius:7px;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text)}
.mk{position:absolute;top:11px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--me);box-shadow:0 0 0 2px var(--raised)}
.mk.sn{background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--me),0 0 0 2px var(--raised)}
.gb{position:absolute;top:2px;height:5px;border:1.5px solid var(--faint);border-top:0;border-radius:0 0 4px 4px;box-sizing:border-box}
.gtx{position:absolute;top:10px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.col{position:absolute;bottom:24px;width:12px;margin-left:-6px;border-radius:4px 4px 0 0;background:var(--me)}
.col.sn{background:var(--surface);box-shadow:inset 0 0 0 2px var(--me)}
.cv{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.base{position:absolute;left:0;right:0;bottom:23px;height:1px;background:var(--faint)}
.seg2{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.sch{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;background:var(--secondary);font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.empty{width:318px;height:28px;border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}.tsub{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:14px}
.stem{position:absolute;width:1px;margin-left:-0.5px;background:var(--faint)}
.axl{position:absolute;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}.mv2{margin:2px 0 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;white-space:nowrap}
.c-carb{background:var(--me)}
.c-pro{background:color-mix(in srgb,var(--me) 58%,var(--surface))}
.c-fat{background:color-mix(in srgb,var(--me) 28%,var(--surface))}
.stk{position:absolute;width:16px;margin-left:-8px;display:flex;flex-direction:column;gap:1px;border-radius:4px 4px 0 0;overflow:hidden}
.stk i{display:block;min-height:2px}
.tsub2{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap;line-height:14px}
[data-theme="cosmic-dream"] .tsub2{color:var(--sub)}
.lg{display:inline-flex;align-items:center;gap:4px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.fl{position:absolute;height:0;border-top:1.5px dotted var(--sub)}
.ft{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;line-height:12px;text-align:center;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;gap:12px;min-height:26px;font-size:12px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--divider);font-variant-numeric:tabular-nums}
.fdot{width:2px;height:16px;border-left:2px dotted var(--faint);margin-left:-8px}
.lead{position:absolute;width:0;border-left:1px dotted var(--sub)}.c-me{background:var(--me);color:var(--me-ink)}.c-her{background:var(--her);color:var(--her-ink)}
.me-carb{background:var(--me)}.me-pro{background:color-mix(in srgb,var(--me) 58%,var(--surface))}.me-fat{background:color-mix(in srgb,var(--me) 28%,var(--surface))}
.her-carb{background:var(--her)}.her-pro{background:color-mix(in srgb,var(--her) 58%,var(--surface))}.her-fat{background:color-mix(in srgb,var(--her) 28%,var(--surface))}
.lg i{width:8px;height:10px;border-radius:2px;display:inline-block;margin-right:-2px}
.lg{gap:4px}
.goal{padding:12px 14px}
.grow{display:grid;grid-template-columns:40px minmax(0,1fr) 92px 78px;align-items:center;gap:8px;min-height:26px;font-size:12px;font-variant-numeric:tabular-nums}
.gl2{font-weight:700}
.gmeter{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}
.gmeter i{display:block;height:100%;border-radius:4px}
.gmeter i.me{background:var(--me)}.gmeter i.her{background:var(--her)}
.gv{text-align:right;font-weight:700;white-space:nowrap}
.gt2{font-weight:500;color:var(--sub)}
.gs{text-align:right;font-weight:700;white-space:nowrap}
.gs.ok{color:var(--text)}.gs.left{color:var(--sub)}.gs.over{color:var(--strong)}
.band{position:absolute;left:0;right:0;background:var(--raised);border-radius:8px}
.tog{position:absolute;width:4px;margin-left:-2px;border-radius:2px;background:var(--both)}
.lane2{position:absolute;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.pc{border-top:0}
.gopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:68px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:12px}
.gopt .gn{font-size:16px;font-weight:700}
.gopt .gd{font-size:12px;color:var(--sub)}
.gopt.on{border-color:var(--primary-edge);background:var(--tint)}
.gopt.on .gd{color:var(--tint-text)}
.in2{width:64px;min-height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--input-bg);text-align:right;padding:0 10px;font-size:16px;font-weight:600}
.ed2{font-size:12px;font-weight:700;color:var(--tint-text);padding:4px 8px;border-radius:999px;background:var(--tint)}.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--sub)}
.fin{display:flex;align-items:center;gap:4px;min-height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--input-bg);padding:0 10px}
.fin input{width:100%;min-width:0;border:0;background:none;padding:0;font-size:16px;font-weight:600;color:var(--text);text-align:right}
.fin i{font-style:normal;font-size:13px;color:var(--sub)}
.sw0{position:relative;flex-shrink:0;width:48px;height:28px;border-radius:999px;background:var(--empty)}
.sw0 i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--switch-knob);box-shadow:var(--lift)}.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--tint-text);background:var(--tint);padding:3px 8px;border-radius:999px}
.basis{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;min-height:56px;border:0;border-radius:16px;background:var(--surface);padding:10px 16px;font-size:13px;line-height:1.45;color:var(--text)}
.basis b{font-size:15px}
.basis span span{color:var(--sub);font-size:12px}
.disc{margin-top:8px;padding:12px 14px;border-radius:16px;background:var(--raised);font-size:12px;line-height:1.55;color:var(--text)}
.disc b{display:block;font-size:13px;margin-bottom:2px}
.steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;font-size:13px;line-height:1.5}
.steps li::before{content:counter(s);grid-row:span 3;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--tint-text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps b{font-size:14px}
.steps span{color:var(--text)}
.steps em{font-style:normal;font-size:11px;color:var(--sub)}
.scr{height:1100px}
</style>
<div class="scr" data-theme="soft-pastel">
<div class="bar"><button type="button" class="iconbtn" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><span style="flex: 1"></span><button type="button" style="border: 0; background: none; padding: 0 12px; min-height: 44px; font-size: 14px; font-weight: 600; color: var(--sub)">건너뛰고 직접 입력</button></div>
<header style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px">
<p class="caption">식단 · 처음 한 번만</p>
<h1 class="title">어떤 목표로 먹나요?</h1>
</header>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" class="gopt"><span class="gn">감량</span><span class="gd">주 0.5%씩</span></button>
<button type="button" class="gopt"><span class="gn">유지</span><span class="gd">지금 그대로</span></button>
<button type="button" class="gopt on" aria-pressed="true"><span class="gn">벌크업</span><span class="gd">+10%</span></button>
</div>
<p class="sec" style="display: flex; align-items: center; gap: 6px">입력하면 목표를 추천해 드릴게요<span style="flex: 1"></span><span class="lock"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>나만 보기</span></p>
<div class="list">
<div class="row" style="min-height: 52px"><span class="tx"><span class="nm" style="font-size: 15px">성별</span></span><div class="seg" role="group" aria-label="성별" style="width: 140px"><button type="button" aria-pressed="true">남</button><button type="button" aria-pressed="false">여</button></div></div>
<div class="row" style="min-height: 52px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<label class="fld"><span>나이</span><span class="fin"><input value="25" aria-label="나이"><i>세</i></span></label>
<label class="fld"><span>키</span><span class="fin"><input value="175" aria-label="키"><i>cm</i></span></label>
<label class="fld"><span>체중</span><span class="fin"><input value="70" aria-label="체중"><i>kg</i></span></label>
</div>
<div class="row" style="min-height: 52px; flex-wrap: wrap; padding: 8px 0"><span class="tx" style="flex-basis: 100%"><span class="nm" style="font-size: 15px">운동</span></span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" class="pick" style="min-height: 34px">거의 안 함</button><button type="button" class="pick" style="min-height: 34px">주 1~3회</button><button type="button" class="pick" style="min-height: 34px" aria-pressed="true">주 3~5회</button><button type="button" class="pick" style="min-height: 34px">거의 매일</button></div></div>
</div>
<p class="sec">추천 목표 · 눌러서 고칠 수 있어요</p>
<div class="list">
<button type="button" class="row" style="min-height: 50px"><span class="tx"><span class="nm" style="font-size: 15px">칼로리</span><span class="ds">하루 소비 약 2,594 + 10%</span></span><span class="vl">2,854kcal</span><span class="ed2">고치기</span></button>
<button type="button" class="row" style="min-height: 50px"><span class="tx"><span class="nm" style="font-size: 15px">단백질</span><span class="ds">체중 × 2.0g · 20%</span></span><span class="vl">140g</span><span class="ed2">고치기</span></button>
<button type="button" class="row" style="min-height: 50px"><span class="tx"><span class="nm" style="font-size: 15px">지방</span><span class="ds">25%</span></span><span class="vl">79g</span><span class="ed2">고치기</span></button>
<button type="button" class="row" style="min-height: 50px"><span class="tx"><span class="nm" style="font-size: 15px">탄수</span><span class="ds">나머지 · 55%</span></span><span class="vl">395g</span><span class="ed2">고치기</span></button>
</div>
<div class="list" style="margin-top: 8px"><div class="row" style="min-height: 56px"><span class="tx"><span class="nm" style="font-size: 15px">체중 변화로 목표 다시 맞추기</span><span class="ds">선택 · 켜면 주 1회 체중을 물어봐요</span></span><span class="sw0" role="switch" aria-checked="false" aria-label="체중 변화로 목표 다시 맞추기"><i></i></span></div></div>
<button type="button" class="basis"><span style="flex: 1; text-align: left"><b>이렇게 계산했어요</b><br><span>Mifflin-St Jeor 식 · 국제스포츠영양학회 · 한국인 영양소 섭취기준</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="disc"><b>참고용 추천이에요</b> 의학적 진단·처방이 아니어서 효력이 없어요. 정확한 목표는 의사나 임상영양사 같은 전문가와 상의해 주세요. 몸 정보는 나만 볼 수 있어요. <span style="color: var(--sub)">(몸 정보는 예시)</span></div>
<div class="foot"><button type="button" class="btn" style="width: 100%">이 목표로 시작</button></div>
</div>
<script>var t=new URLSearchParams(location.search).get("theme");if(t)document.querySelector(".scr").dataset.theme=t;</script>
</body>
</html>
